<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TAKE Coffee & More</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#121212',
            surface: '#1A1A1A',
            gold: '#D4AF37',
            goldbright: '#E5B94E',
            ink: '#F5F5F3',
            stone: '#8E8E93',
          },
          fontFamily: {
            display: ['"Fraunces"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: #121212;
    }

    body {
      overscroll-behavior-y: none;
    }

    .num-tabular {
      font-variant-numeric: tabular-nums;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    .tier-badge-member {
      background: rgba(142, 142, 147, 0.14);
      color: #C7C7CC;
      border: 1px solid rgba(142, 142, 147, 0.28);
    }

    .tier-badge-silver {
      background: linear-gradient(135deg, rgba(200, 200, 205, 0.20), rgba(148, 148, 155, 0.10));
      color: #E4E4E7;
      border: 1px solid rgba(200, 200, 205, 0.35);
    }

    .tier-badge-gold {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.24), rgba(229, 185, 78, 0.10));
      color: #E5B94E;
      border: 1px solid rgba(212, 175, 55, 0.45);
    }

    @keyframes qrPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.30), 0 0 20px 2px rgba(212, 175, 55, 0.14);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(212, 175, 55, 0), 0 0 30px 6px rgba(212, 175, 55, 0.26);
      }
    }

    .qr-pulse {
      animation: qrPulse 2.8s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .qr-pulse {
        animation: none;
      }
    }

    .nav-btn.active .nav-icon {
      color: #D4AF37;
    }

    .nav-btn.active .nav-label {
      color: #E5B94E;
    }

    .nav-btn .nav-icon,
    .nav-btn .nav-label {
      color: #8E8E93;
      transition: color 0.15s ease;
    }
  </style>
</head>

<body class="bg-obsidian text-ink font-sans antialiased min-h-screen">

  <div id="app" class="max-w-md mx-auto min-h-screen px-4 pt-6 pb-28">

    <!-- Header -->
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-surface border border-gold/40 flex items-center justify-center">
          <i data-lucide="coffee" class="w-4 h-4 text-gold"></i>
        </div>
        <div class="leading-none">
          <p class="font-display text-lg font-semibold tracking-tight">TAKE</p>
          <p class="text-[9px] uppercase tracking-[0.16em] text-stone -mt-0.5">Coffee &amp; More</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="user-name" class="text-sm text-ink/90">Guest</span>
        <span id="tier-badge"
          class="tier-badge-member text-[10px] font-medium uppercase tracking-wide rounded-full px-2.5 py-1">Member</span>
      </div>
    </header>

    <!-- ===== Card tab ===== -->
    <section id="tab-card">

      <!-- Balance card -->
      <div class="bg-surface border border-white/10 rounded-3xl p-6 mb-4">
        <p class="text-xs uppercase tracking-[0.14em] text-stone mb-2">Your balance</p>
        <div class="flex items-baseline gap-1.5 mb-5">
          <span id="balance-value" class="font-display text-5xl text-goldbright num-tabular">0</span>
          <span class="text-stone text-sm mb-1">pts</span>
        </div>

        <div class="flex items-center justify-between mb-2.5">
          <p id="progress-caption" class="text-xs text-stone">800 pts to a free coffee</p>
          <p id="progress-count" class="text-xs text-gold font-medium num-tabular">0/8</p>
        </div>
        <div id="segment-row" class="flex items-center gap-1.5"></div>
      </div>

      <!-- QR card -->
      <div class="bg-surface border-2 border-gold/70 rounded-3xl p-6 flex flex-col items-center">
        <div id="qrcode" class="qr-pulse bg-ink rounded-xl p-2.5 mb-3"></div>
        <p class="text-xs text-stone">Show this to your barista</p>
      </div>

    </section>

    <!-- ===== History tab ===== -->
    <section id="tab-history" class="hidden">
      <div id="tx-list" class="space-y-2"></div>
      <p id="tx-empty" class="hidden text-center text-sm text-stone py-14">No transactions yet — your first cup starts
        the count.</p>
    </section>

    <!-- ===== Rewards tab ===== -->
    <section id="tab-rewards" class="hidden">
      <div class="bg-surface border border-white/10 rounded-3xl p-5 mb-4">
        <p class="text-sm text-ink/90 mb-1">How it works</p>
        <p class="text-xs text-stone leading-relaxed">Every cup earns 100 pts. Collect 800 pts (8 cups) and your 9th
          coffee is on us.</p>
      </div>

      <div class="space-y-3" id="tier-ladder"></div>
    </section>

  </div>

  <!-- Bottom nav -->
  <nav class="fixed inset-x-0 bottom-0 z-30">
    <div class="max-w-md mx-auto bg-surface/95 backdrop-blur border-t border-white/10 flex"
      style="padding-bottom: env(safe-area-inset-bottom);">
      <button data-tab="card" onclick="setTab('card')"
        class="nav-btn active flex-1 flex flex-col items-center gap-1 py-3">
        <i data-lucide="credit-card" class="nav-icon w-5 h-5"></i>
        <span class="nav-label text-[10px] font-medium">Card</span>
      </button>
      <button data-tab="history" onclick="setTab('history')"
        class="nav-btn flex-1 flex flex-col items-center gap-1 py-3">
        <i data-lucide="clock" class="nav-icon w-5 h-5"></i>
        <span class="nav-label text-[10px] font-medium">History</span>
      </button>
      <button data-tab="rewards" onclick="setTab('rewards')"
        class="nav-btn flex-1 flex flex-col items-center gap-1 py-3">
        <i data-lucide="gift" class="nav-icon w-5 h-5"></i>
        <span class="nav-label text-[10px] font-medium">Rewards</span>
      </button>
    </div>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.('#121212');
      tg.setBackgroundColor?.('#121212');
    }

    const REWARD_THRESHOLD = 800;
    const POINTS_PER_CUP = 100;
    const SEGMENTS = 8;

    const TIERS = [
      { name: 'Member', range: '0–1 free coffees', cls: 'tier-badge-member', icon: 'circle' },
      { name: 'Silver', range: '2–4 free coffees', cls: 'tier-badge-silver', icon: 'award' },
      { name: 'Gold', range: '5+ free coffees', cls: 'tier-badge-gold', icon: 'crown' },
    ];

    // Demo data mirrors the real zero-start rule so the design is honest even
    // when previewed outside Telegram / without the FastAPI backend running.
    const DEMO_DATA = {
      first_name: 'Guest',
      points_balance: 0,
      free_coffees_redeemed: 0,
      tier: 'Member',
      transactions: [],
    };

    function tierBadgeClass(tier) {
      return { Member: 'tier-badge-member', Silver: 'tier-badge-silver', Gold: 'tier-badge-gold' }[tier] || 'tier-badge-member';
    }

    function render(data) {
      document.getElementById('user-name').textContent = data.first_name || 'Guest';

      const badge = document.getElementById('tier-badge');
      badge.textContent = data.tier;
      badge.className = `${tierBadgeClass(data.tier)} text-[10px] font-medium uppercase tracking-wide rounded-full px-2.5 py-1`;

      document.getElementById('balance-value').textContent = data.points_balance.toLocaleString('en-US');

      const cups = Math.min(Math.floor(data.points_balance / POINTS_PER_CUP), SEGMENTS);
      const remaining = Math.max(REWARD_THRESHOLD - data.points_balance, 0);
      document.getElementById('progress-caption').textContent =
        remaining > 0 ? `${remaining} pts to a free coffee` : 'Free coffee unlocked!';
      document.getElementById('progress-count').textContent = `${cups}/${SEGMENTS}`;

      const row = document.getElementById('segment-row');
      row.innerHTML = '';
      for (let i = 1; i <= SEGMENTS; i++) {
        const seg = document.createElement('div');
        const on = i <= cups;
        seg.className = `h-2.5 flex-1 rounded-full ${on ? 'bg-gold' : 'bg-white/10'}`;
        if (on) seg.style.boxShadow = '0 0 6px rgba(212,175,55,0.55)';
        row.appendChild(seg);
      }

      const list = document.getElementById('tx-list');
      const empty = document.getElementById('tx-empty');
      list.innerHTML = '';
      if (!data.transactions.length) {
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        data.transactions.forEach((tx) => {
          const isEarn = tx.points_change > 0;
          const date = new Date(tx.timestamp).toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
          const row2 = document.createElement('div');
          row2.className = 'bg-surface border border-white/10 rounded-2xl px-4 py-3 flex items-center justify-between';
          row2.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center ${isEarn ? 'bg-gold/15' : 'bg-white/[0.06]'}">
              <i data-lucide="${isEarn ? 'plus' : 'gift'}" class="w-4 h-4 ${isEarn ? 'text-gold' : 'text-stone'}"></i>
            </div>
            <div>
              <p class="text-sm text-ink/90">${tx.label || (isEarn ? 'Cup earned' : 'Reward redeemed')}</p>
              <p class="text-xs text-stone">${date}</p>
            </div>
          </div>
          <p class="text-sm font-medium num-tabular ${isEarn ? 'text-gold' : 'text-stone'}">
            ${isEarn ? '+' : ''}${tx.points_change}
          </p>`;
          list.appendChild(row2);
        });
      }

      // Rewards tier ladder
      const ladder = document.getElementById('tier-ladder');
      ladder.innerHTML = '';
      TIERS.forEach((t) => {
        const isCurrent = t.name === data.tier;
        const card = document.createElement('div');
        card.className = `rounded-2xl p-4 flex items-center justify-between border ${isCurrent ? 'border-gold/60 bg-gold/[0.06]' : 'border-white/10 bg-surface'}`;
        card.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full flex items-center justify-center ${isCurrent ? 'bg-gold/15' : 'bg-white/[0.06]'}">
            <i data-lucide="${t.icon}" class="w-4 h-4 ${isCurrent ? 'text-gold' : 'text-stone'}"></i>
          </div>
          <div>
            <p class="text-sm ${isCurrent ? 'text-goldbright' : 'text-ink/90'} font-medium">${t.name}</p>
            <p class="text-xs text-stone">${t.range}</p>
          </div>
        </div>
        ${isCurrent ? '<span class="text-[10px] uppercase tracking-wide text-gold">Current</span>' : ''}`;
        ladder.appendChild(card);
      });

      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), {
        text: `TAKE:${data.telegram_id || 'demo'}`,
        width: 176,
        height: 176,
        colorDark: '#121212',
        colorLight: '#F5F5F3',
        correctLevel: QRCode.CorrectLevel.M,
      });

      lucide.createIcons();
    }

    function setTab(tab) {
      ['card', 'history', 'rewards'].forEach((t) => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
      });
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
    }

    async function init() {
      setTab('card');

      const tgUser = tg?.initDataUnsafe?.user;
      const telegramId = tgUser?.id;
      const firstName = tgUser?.first_name || 'Guest';

      try {
        if (!telegramId) throw new Error('no telegram context');
        const res = await fetch(`/api/user/${telegramId}?first_name=${encodeURIComponent(firstName)}`);
        if (!res.ok) throw new Error('api error');
        const state = await res.json();

        // History fetch is best-effort — a failure here shouldn't blank
        // out the whole card view, just leave history empty.
        let transactions = [];
        try {
          const txRes = await fetch(`/api/user/${telegramId}/transactions`);
          if (txRes.ok) transactions = await txRes.json();
        } catch (txErr) { /* leave transactions empty */ }

        render({ ...state, telegram_id: telegramId, transactions });
      } catch (e) {
        render({ ...DEMO_DATA, first_name: firstName, telegram_id: telegramId || 'demo' });
      }
    }

    init();
  </script>
</body>

</html>
