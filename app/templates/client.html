<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TAKE coffee &amp; more — карта лояльности</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            charcoal: '#0F0F12',
            surface: 'rgba(255,255,255,0.045)',
            gold: '#E2A85C',
            coral: '#E87A5D',
            ink: '#F5F1EA',
            stone: '#9C978C',
            stonedim: '#6B675E',
          },
          fontFamily: {
            display: ['"Fraunces"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: #0F0F12;
    }

    body {
      overscroll-behavior-y: none;
    }

    .glass {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .num-tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Card flip */
    .flip-scene {
      perspective: 1600px;
    }

    .flip-card {
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flip-card.flipped {
      transform: rotateY(180deg);
    }

    .flip-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    /* QR glow pulse */
    @keyframes qrPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(226, 168, 92, 0.35), 0 0 24px 2px rgba(226, 168, 92, 0.18);
      }

      50% {
        box-shadow: 0 0 0 8px rgba(226, 168, 92, 0), 0 0 36px 8px rgba(226, 168, 92, 0.32);
      }
    }

    .qr-pulse {
      animation: qrPulse 2.6s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .qr-pulse {
        animation: none;
      }

      .flip-card {
        transition: none;
      }
    }

    /* Sliding tab indicator */
    #tab-indicator {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Bean progress glow */
    .bean-filled {
      filter: drop-shadow(0 0 6px rgba(226, 168, 92, 0.65));
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-charcoal text-ink font-sans antialiased min-h-screen">

  <div id="app" class="max-w-md mx-auto min-h-screen px-4 pt-6 pb-10">

    <!-- Header -->
    <header class="flex items-center justify-between mb-6">
      <div>
        <p class="font-display text-2xl leading-none tracking-tight">TAKE</p>
        <p class="text-[11px] uppercase tracking-[0.18em] text-stone mt-1">coffee &amp; more</p>
      </div>
      <div id="level-badge" class="glass rounded-full px-3.5 py-1.5 flex items-center gap-1.5">
        <i data-lucide="award" class="w-3.5 h-3.5 text-gold"></i>
        <span id="level-label" class="text-xs font-medium text-ink">—</span>
      </div>
    </header>

    <!-- Hero balance card -->
    <section class="glass rounded-3xl p-6 mb-5">
      <p class="text-xs uppercase tracking-[0.14em] text-stone mb-2">баланс баллов</p>
      <div class="flex items-baseline gap-2 mb-5">
        <span id="balance-value" class="font-display text-5xl num-tabular">—</span>
        <span class="text-stone text-sm mb-1">баллов</span>
      </div>

      <div class="flex items-center justify-between mb-2.5">
        <p id="progress-caption" class="text-xs text-stone">&nbsp;</p>
        <p id="progress-count" class="text-xs text-gold font-medium num-tabular">&nbsp;</p>
      </div>
      <div id="bean-row" class="flex items-center gap-1.5"></div>
    </section>

    <!-- Tab switcher -->
    <div class="relative glass rounded-full p-1 flex mb-5">
      <div id="tab-indicator" class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-gold/90 rounded-full"></div>
      <button data-tab="card" onclick="setTab('card')"
        class="tab-btn relative z-10 flex-1 py-2.5 text-sm font-medium rounded-full transition-colors">
        Карта / QR
      </button>
      <button data-tab="history" onclick="setTab('history')"
        class="tab-btn relative z-10 flex-1 py-2.5 text-sm font-medium rounded-full transition-colors">
        История
      </button>
    </div>

    <!-- Panel: Card / QR -->
    <section id="panel-card" class="flex flex-col items-center">
      <div class="flip-scene w-full mb-4" style="height: 200px;">
        <div id="flip-card" class="flip-card relative w-full h-full cursor-pointer" onclick="flipCard()">
          <div class="flip-face absolute inset-0 glass rounded-2xl p-5 flex flex-col justify-between">
            <div class="flex items-start justify-between">
              <p class="font-display text-lg">TAKE</p>
              <i data-lucide="coffee" class="w-5 h-5 text-gold"></i>
            </div>
            <div>
              <p id="card-name" class="text-base font-medium">—</p>
              <p class="text-xs text-stone mt-0.5">Нажмите, чтобы показать QR</p>
            </div>
          </div>
          <div
            class="flip-face flip-back absolute inset-0 glass rounded-2xl p-5 flex flex-col items-center justify-center gap-3">
            <div id="qrcode" class="qr-pulse bg-ink rounded-xl p-2.5"></div>
            <p class="text-[11px] text-stone">Покажите бариста на кассе</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Panel: History -->
    <section id="panel-history" class="hidden">
      <div id="tx-list" class="space-y-2"></div>
      <p id="tx-empty" class="hidden text-center text-sm text-stone py-10">Пока нет операций</p>
    </section>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.('#0F0F12');
      tg.setBackgroundColor?.('#0F0F12');
    }
    function haptic(style = 'light') {
      tg?.HapticFeedback?.impactOccurred(style);
    }

    const REWARD_THRESHOLD = 8; // покупок до бесплатного напитка

    // Демо-данные — используются только если API недоступен (просмотр вне Telegram)
    const DEMO_DATA = {
      user: { first_name: 'Гоар', bonus_balance: 1250, cashback_percent: 5, level: 'Gold', progress_count: 5 },
      transactions: [
        { type: 'ACCUMULATE', branch: 'Tumanyan 38', sum_amd: 2400, bonus_change: 120, timestamp: '2026-08-22T09:14:00' },
        { type: 'DEDUCT', branch: 'Abovyan City', sum_amd: 0, bonus_change: -400, timestamp: '2026-08-19T17:02:00' },
        { type: 'ACCUMULATE', branch: 'Tumanyan 38', sum_amd: 1800, bonus_change: 90, timestamp: '2026-08-17T08:41:00' },
        { type: 'ACCUMULATE', branch: 'Komitas Ave', sum_amd: 3200, bonus_change: 160, timestamp: '2026-08-12T13:20:00' },
      ],
    };

    function render(data) {
      const u = data.user;
      document.getElementById('balance-value').textContent = u.bonus_balance.toLocaleString('ru-RU');
      document.getElementById('level-label').textContent = u.level;
      document.getElementById('card-name').textContent = u.first_name;

      const filled = Math.min(u.progress_count, REWARD_THRESHOLD);
      const remaining = REWARD_THRESHOLD - filled;
      document.getElementById('progress-caption').textContent =
        remaining > 0 ? `ещё ${remaining} до бесплатного кофе` : 'бесплатный кофе доступен';
      document.getElementById('progress-count').textContent = `${filled}/${REWARD_THRESHOLD}`;

      const beanRow = document.getElementById('bean-row');
      beanRow.innerHTML = '';
      for (let i = 1; i <= REWARD_THRESHOLD; i++) {
        const on = i <= filled;
        const bean = document.createElement('div');
        bean.className = `h-2.5 flex-1 rounded-full ${on ? 'bg-gold bean-filled' : 'bg-white/10'}`;
        beanRow.appendChild(bean);
      }

      const list = document.getElementById('tx-list');
      const empty = document.getElementById('tx-empty');
      list.innerHTML = '';
      if (!data.transactions.length) {
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        data.transactions.forEach((tx) => {
          const isAdd = tx.type === 'ACCUMULATE';
          const date = new Date(tx.timestamp).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
          const row = document.createElement('div');
          row.className = 'glass rounded-2xl px-4 py-3 flex items-center justify-between';
          row.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center ${isAdd ? 'bg-gold/15' : 'bg-coral/15'}">
              <i data-lucide="${isAdd ? 'plus' : 'minus'}" class="w-4 h-4 ${isAdd ? 'text-gold' : 'text-coral'}"></i>
            </div>
            <div>
              <p class="text-sm font-medium">${tx.branch}</p>
              <p class="text-xs text-stonedim">${date}</p>
            </div>
          </div>
          <p class="text-sm font-medium num-tabular ${isAdd ? 'text-gold' : 'text-coral'}">
            ${isAdd ? '+' : ''}${tx.bonus_change}
          </p>`;
          list.appendChild(row);
        });
      }

      // QR-код — платёжный идентификатор клиента для эндпоинта /api/transaction/scan
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), {
        text: `TAKE:${data.telegram_id || 'demo'}`,
        width: 176,
        height: 176,
        colorDark: '#0F0F12',
        colorLight: '#F5F1EA',
        correctLevel: QRCode.CorrectLevel.M,
      });

      lucide.createIcons();
    }

    function setTab(tab) {
      haptic('light');
      document.getElementById('panel-card').classList.toggle('hidden', tab !== 'card');
      document.getElementById('panel-history').classList.toggle('hidden', tab !== 'history');
      document.getElementById('tab-indicator').style.transform = tab === 'history' ? 'translateX(100%)' : 'translateX(0)';
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.classList.toggle('text-charcoal', btn.dataset.tab === tab);
        btn.classList.toggle('text-stone', btn.dataset.tab !== tab);
      });
    }

    function flipCard() {
      haptic('medium');
      document.getElementById('flip-card').classList.toggle('flipped');
    }

    async function init() {
      setTab('card');
      const telegramId = tg?.initDataUnsafe?.user?.id;
      try {
        if (!telegramId) throw new Error('no telegram context');
        const res = await fetch(`/api/user/${telegramId}`);
        if (!res.ok) throw new Error('api error');
        const payload = await res.json();
        render({ ...payload, telegram_id: telegramId });
      } catch (e) {
        // Просмотр вне Telegram или бэкенд недоступен — показываем демо-данные
        render({ ...DEMO_DATA, telegram_id: 'demo' });
      }
    }

    init();
  </script>
</body>

</html>
